<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.4rem;
      text-align: center;
    }
    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 0.9rem;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cfd6de;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <form class="login-card" action="#" method="post">
    <h1>Login</h1>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter your password" required />

    <button type="submit">Sign In</button>
    <p class="hint">Forgot your password?</p>
  </form>
</body>
</html>
